<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shenna M. Maceda - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #c09110;
            --secondary: #e6a61c;
            --accent: #fff8e1;
            --dark: #423400;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #fff9e6 0%, #f7e9c4 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--dark);
            line-height: 1.7;
        }
        .profile-wrapper {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(192, 145, 16, 0.15);
            overflow: hidden;
        }
        .page-header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 35px;
            text-align: center;
        }
        .page-header h1 {
            font-size: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .tagline {
            font-size: 17px;
            opacity: 0.9;
        }
        .page-body {
            padding: 35px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 25px;
        }
        .info-label {
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
            text-transform: uppercase;
        }
        .info-value {
            font-size: 15px;
            color: #5c4a00;
        }
        .nav-link {
            text-align: center;
            margin-top: 25px;
        }
        .nav-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .nav-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="profile-wrapper">
        <header class="page-header">
            <h1>Shenna M. Maceda</h1>
            <p class="tagline">Personal Profile</p>
        </header>

        <main class="page-body">
            <h2 class="section-title">Personal Information</h2>
            <div class="info-grid">
                <div>
                    <span class="info-label">Full Name:</span>
                    <span class="info-value">Shenna M. Maceda</span>
                </div>
                <div>
                    <span class="info-label">Date of Birth:</span>
                    <span class="info-value">May 28, 2004</span>
                </div>
                <div>
                    <span class="info-label">Age:</span>
                    <span class="info-value">22 years old</span>
                </div>
                <div>
                    <span class="info-label">Place of Birth:</span>
                    <span class="info-value">Brgy. Cabacungan, Dulag, Leyte</span>
                </div>
                <div>
                    <span class="info-label">Religion:</span>
                    <span class="info-value">Roman Catholic</span>
                </div>
                <div></div>
                <!-- Father & Mother — SIDE BY SIDE -->
                <div>
                    <span class="info-label">Father:</span>
                    <span class="info-value">Simeon Maceda</span>
                </div>
                <div>
                    <span class="info-label">Mother:</span>
                    <span class="info-value">Analyn Mullera</span>
                </div>
            </div>

            <p class="nav-link">
                <a href="education.html">📄 View Educational Background →</a>
            </p>
        </main>
    </div>
</body>
</html>
